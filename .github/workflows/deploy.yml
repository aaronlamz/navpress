name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main # 或者你正在使用的其他主分支

permissions:
  contents: write # 确保 GITHUB_TOKEN 有写权限
  pages: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Install dependencies
        run: yarn install # 或者 npm install

      - name: Build project
        run: |
          echo "=== Starting build process ==="
          echo "=== Current directory: $(pwd) ==="
          echo "=== Directory contents before build: ==="
          ls -la
          echo "=== Running yarn build ==="
          yarn build
          echo "=== Build exit code: $? ==="
          echo "=== Build process completed ==="
          echo "=== Checking build output ==="
          ls -la
          echo "=== Checking dist directory ==="
          ls -la dist/ || echo "dist directory not found!"
          echo "=== Checking if dist exists: ==="
          test -d dist && echo "dist directory exists" || echo "dist directory does not exist"
          echo "=== Checking dist contents recursively: ==="
          find . -name "dist" -type d 2>/dev/null || echo "No dist directories found"

      - name: List build output
        run: |
          echo "=== Build output directory contents ==="
          ls -la ./dist
          echo "=== Assets directory contents ==="
          ls -la ./dist/assets || echo "Assets directory not found"
          echo "=== Images directory contents ==="
          ls -la ./dist/images || echo "Images directory not found"

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ${{ github.workspace }}/dist
        #   destination_dir: navpress  # 部署到 navpress 子目录，不指定就是根目录
        #   cname: aaronlamz.github.io  # 可选: 如果你需要自定义域名
