name: Auto Deploy to NPM

on:
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
      - '.github/workflows/deploy.yml'
      - 'navpress.config.js'
      - 'README*'

permissions:
  contents: write
  actions: write
  pull-requests: write

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0
          persist-credentials: true

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          registry-url: 'https://registry.npmjs.org'
          always-auth: true

      - name: Setup Yarn
        run: npm install -g yarn

      - name: Cache dependencies
        uses: actions/cache@v3
        with:
          path: ~/.cache/yarn
          key: ${{ runner.os }}-yarn-${{ hashFiles('**/yarn.lock') }}
          restore-keys: |
            ${{ runner.os }}-yarn-

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Run tests (if available)
        run: yarn test || echo "No tests found"

      - name: Run linter (optional)
        run: yarn lint || echo "Linting issues found, but continuing deployment"

      - name: Build package
        run: yarn build

      - name: Configure Git
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"

      - name: Configure npm authentication
        run: |
          rm -f ~/.npmrc
          echo "//registry.npmjs.org/:_authToken=${{ secrets.NPM_TOKEN }}" > ~/.npmrc
          echo "always-auth=true" >> ~/.npmrc
          echo "registry=https://registry.npmjs.org/" >> ~/.npmrc
          echo "=== Debug npm authentication ==="
          cat ~/.npmrc
          npm whoami || echo "❌ npm whoami failed"

      - name: Debug npm before publish
        run: |
          npm whoami
          npm ping
          npm view navpress version || echo "Package not found yet"

      - name: Check if should deploy
        id: should-deploy
        run: |
          COMMIT_MSG="${{ github.event.head_commit.message }}"
          if [[ $COMMIT_MSG =~ \[deploy\] ]] || [[ $COMMIT_MSG =~ \[publish\] ]] || [[ $COMMIT_MSG =~ deploy: ]]; then
            echo "deploy=true" >> $GITHUB_OUTPUT
            echo "✅ Deploy triggered by commit message: $COMMIT_MSG"
          else
            echo "deploy=false" >> $GITHUB_OUTPUT
            echo "⏭️ Skipping deployment - no deploy identifier found in: $COMMIT_MSG"
          fi

      - name: Bump version and publish
        if: steps.should-deploy.outputs.deploy == 'true'
        run: |
          PACKAGE_NAME=$(node -p "require('./package.json').name")
          echo "Detected package name: $PACKAGE_NAME"

          # 获取远程版本
          REMOTE_VERSION=$(npm view $PACKAGE_NAME version 2>/dev/null || echo "0.0.0")
          echo "Remote npm version: $REMOTE_VERSION"

          # 获取本地版本
          LOCAL_VERSION=$(node -p "require('./package.json').version")
          echo "Local version: $LOCAL_VERSION"

          # 默认发布 patch 版本
          DEPLOY_TYPE="patch"

          # 根据 commit message 决定版本类型
          COMMIT_MSG="${{ github.event.head_commit.message }}"
          echo "Commit message: $COMMIT_MSG"

          if [[ $COMMIT_MSG =~ ^breaking: ]] || [[ $COMMIT_MSG =~ \[deploy:major\] ]]; then
            DEPLOY_TYPE="major"
          elif [[ $COMMIT_MSG =~ ^feat: ]] || [[ $COMMIT_MSG =~ \[deploy:minor\] ]]; then
            DEPLOY_TYPE="minor"
          fi
          echo "Deploying with type: $DEPLOY_TYPE"

          # 更新版本号
          npm version $DEPLOY_TYPE --no-git-tag-version
          NEW_VERSION=$(node -p "require('./package.json').version")
          echo "New version: $NEW_VERSION"

          # 提交并打 tag
          git add package.json yarn.lock
          git commit -m "chore: bump version to v$NEW_VERSION [skip ci]"
          git tag -f "v$NEW_VERSION"
          git remote set-url origin https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git
          git push origin main
          git push origin "v$NEW_VERSION" --force

          # 发布到 npm
          echo "Publishing navpress@$NEW_VERSION to npm..."
          if npm publish --access public; then
            echo "Successfully published navpress@$NEW_VERSION"
          else
            echo "❌ Publish failed, exiting..."
            exit 1
          fi

          # ✅ 发布成功后，确保 package.json 中的版本号为最新并 push
          git add package.json yarn.lock
          git commit -m "chore: update package.json to published version v$NEW_VERSION [skip ci]" || echo "No changes to commit"
          git push origin main

      - name: Get version for release
        id: get-version
        run: echo "version=$(node -p "require('./package.json').version")" >> $GITHUB_OUTPUT

      - name: Create GitHub Release
        uses: actions/create-release@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: v${{ steps.get-version.outputs.version }}
          release_name: Release v${{ steps.get-version.outputs.version }}
          body: |
            Auto-deployed from commit: ${{ github.event.head_commit.message }}
          draft: false
          prerelease: false
