name: Auto Deploy to NPM

on:
  push:
    branches: [main]

permissions:
  contents: write
  actions: write
  pull-requests: write

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0
          persist-credentials: true

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          registry-url: 'https://registry.npmjs.org'
          always-auth: true

      - name: Setup Yarn
        run: npm install -g yarn

      - name: Cache dependencies
        uses: actions/cache@v3
        with:
          path: ~/.cache/yarn
          key: ${{ runner.os }}-yarn-${{ hashFiles('**/yarn.lock') }}
          restore-keys: |
            ${{ runner.os }}-yarn-

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Run tests (if available)
        run: yarn test || echo "No tests found"

      - name: Run linter (optional)
        run: yarn lint || echo "Linting issues found, but continuing deployment"

      - name: Build package
        run: yarn build

      - name: Configure Git
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"

      - name: Configure npm authentication
        run: |
          echo "registry=https://registry.npmjs.org/" > ~/.npmrc
          echo "//registry.npmjs.org/:_authToken=${{ secrets.NPM_TOKEN }}" >> ~/.npmrc
          echo "always-auth=true" >> ~/.npmrc

          echo "=== .npmrc content (token masked) ==="
          cat ~/.npmrc

          echo "=== npm whoami ==="
          npm whoami || echo "❌ npm whoami failed"

      - name: Bump patch version and publish
        run: |
          PACKAGE_NAME=$(node -p "require('./package.json').name")
          echo "Detected package name: $PACKAGE_NAME"

          # 获取远程版本
          if npm view "$PACKAGE_NAME" >/dev/null 2>&1; then
            REMOTE_VERSION=$(npm view "$PACKAGE_NAME" version 2>/dev/null || echo "0.0.0")
            echo "Remote npm version: $REMOTE_VERSION"
          else
            echo "Package '$PACKAGE_NAME' does not exist in registry"
            REMOTE_VERSION="0.0.0"
          fi

          LOCAL_VERSION=$(node -p "require('./package.json').version")
          echo "Local version: $LOCAL_VERSION"

          # 如果本地版本落后，先对齐远程版本
          if [ "$(printf '%s\n' "$REMOTE_VERSION" "$LOCAL_VERSION" | sort -V | head -n1)" != "$REMOTE_VERSION" ]; then
            echo "Syncing local version to $REMOTE_VERSION"
            npm version $REMOTE_VERSION --no-git-tag-version
            LOCAL_VERSION=$REMOTE_VERSION
          fi

          # 固定只升 patch
          npm version patch --no-git-tag-version
          NEW_VERSION=$(node -p "require('./package.json').version")
          echo "New version: $NEW_VERSION"

          echo "Publishing $PACKAGE_NAME@$NEW_VERSION to npm..."
          npm publish --access public

          # 发布成功后，提交 package.json / yarn.lock 以及 tag
          git add package.json yarn.lock
          git commit -m "chore: bump version to v$NEW_VERSION [skip ci]" || echo "No changes to commit"

          if git tag -l "v$NEW_VERSION" | grep -q "v$NEW_VERSION"; then
            git tag -d "v$NEW_VERSION"
            git push origin --delete "v$NEW_VERSION" || true
          fi
          git tag "v$NEW_VERSION"

          git remote set-url origin https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git
          git push origin main
          git push origin "v$NEW_VERSION"

      - name: Get version for release
        id: get-version
        run: echo "version=$(node -p "require('./package.json').version")" >> $GITHUB_OUTPUT

      - name: Create GitHub Release
        uses: actions/create-release@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: v${{ steps.get-version.outputs.version }}
          release_name: Release v${{ steps.get-version.outputs.version }}
          body: |
            Auto-deployed from commit: ${{ github.event.head_commit.message }}

            Changes:
            ${{ github.event.head_commit.message }}
          draft: false
          prerelease: false
