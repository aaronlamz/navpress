name: Auto Deploy to NPM

on:
  push:
    branches: [main]

permissions:
  contents: write
  actions: write
  pull-requests: write

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0
          persist-credentials: true

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          registry-url: 'https://registry.npmjs.org'
          always-auth: true

      - name: Setup Yarn
        run: npm install -g yarn

      - name: Cache dependencies
        uses: actions/cache@v3
        with:
          path: ~/.cache/yarn
          key: ${{ runner.os }}-yarn-${{ hashFiles('**/yarn.lock') }}
          restore-keys: |
            ${{ runner.os }}-yarn-

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Run tests (if available)
        run: yarn test || echo "No tests found"

      - name: Run linter (optional)
        run: yarn lint || echo "Linting issues found, but continuing deployment"

      - name: Build package
        run: yarn build

      - name: Configure Git
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"

      - name: Configure npm authentication
        run: |
          echo "//registry.npmjs.org/:_authToken=${{ secrets.NPM_TOKEN }}" > ~/.npmrc
          echo "registry=https://registry.npmjs.org/" >> ~/.npmrc
          echo "always-auth=true" >> ~/.npmrc
          echo "=== npm config list ==="
          npm config list
          echo "=== npm whoami ==="
          npm whoami || echo "npm whoami failed"
          echo "=== npm view navpress ==="
          npm view navpress || echo "npm view navpress failed"

      - name: Bump version and publish
        run: |
          # 首先获取npm远程的最新版本
          echo "Checking npm remote version..."
          REMOTE_VERSION=$(npm view navpress version 2>/dev/null || echo "0.0.0")
          echo "Remote npm version: $REMOTE_VERSION"

          # 获取本地当前版本
          LOCAL_VERSION=$(node -p "require('./package.json').version")
          echo "Local package.json version: $LOCAL_VERSION"

          # 如果本地版本低于远程版本，先同步到远程版本
          if [ "$(printf '%s\n' "$REMOTE_VERSION" "$LOCAL_VERSION" | sort -V | head -n1)" != "$REMOTE_VERSION" ]; then
            echo "Local version $LOCAL_VERSION is lower than remote version $REMOTE_VERSION"
            echo "Updating local version to match remote..."
            npm version $REMOTE_VERSION --no-git-tag-version
            LOCAL_VERSION=$REMOTE_VERSION
            echo "Updated local version to: $LOCAL_VERSION"
          fi

          # 根据提交信息确定版本类型
          COMMIT_MSG="${{ github.event.head_commit.message }}"
          echo "Commit message: $COMMIT_MSG"

          if [[ $COMMIT_MSG =~ ^breaking: ]] || [[ $COMMIT_MSG =~ \[deploy:major\] ]]; then
            DEPLOY_TYPE="major"
          elif [[ $COMMIT_MSG =~ ^feat: ]] || [[ $COMMIT_MSG =~ \[deploy:minor\] ]]; then
            DEPLOY_TYPE="minor"
          else
            DEPLOY_TYPE="patch"
          fi

          echo "Deploying with type: $DEPLOY_TYPE"

          # 根据类型选择版本增量
          case $DEPLOY_TYPE in
            major)
              npm version major --no-git-tag-version
              ;;
            minor)
              npm version minor --no-git-tag-version
              ;;
            *)
              npm version patch --no-git-tag-version
              ;;
          esac

          # 获取新版本号
          NEW_VERSION=$(node -p "require('./package.json').version")
          echo "New version: $NEW_VERSION"

          # 提交版本更改
          git add package.json yarn.lock
          git commit -m "chore: bump version to v$NEW_VERSION [skip ci]"

          # 创建 git tag (如果已存在则删除)
          if git tag -l "v$NEW_VERSION" | grep -q "v$NEW_VERSION"; then
            echo "Tag v$NEW_VERSION already exists, deleting it..."
            git tag -d "v$NEW_VERSION"
            git push origin --delete "v$NEW_VERSION" || echo "Remote tag deletion failed, continuing..."
          fi
          git tag "v$NEW_VERSION"

          # 配置远程 URL 并推送更改和标签
          git remote set-url origin https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git
          git push origin main
          git push origin "v$NEW_VERSION"

          # 发布到 npm
          echo "Publishing to npm..."
          echo "Attempting to publish version $NEW_VERSION..."

          # 尝试发布，如果失败则使用force
          PUBLISH_SUCCESS=false
          if npm publish --access public; then
            echo "Successfully published navpress@$NEW_VERSION"
            PUBLISH_SUCCESS=true
          else
            echo "Regular publish failed, trying with --force..."
            if npm publish --access public --force; then
              echo "Successfully published navpress@$NEW_VERSION with --force"
              PUBLISH_SUCCESS=true
            else
              echo "Force publish also failed, attempting to republish entire package..."
              echo "This will create a fresh package entry in npm registry"
              if npm publish --access public --force --registry https://registry.npmjs.org/; then
                echo "Successfully republished entire package"
                PUBLISH_SUCCESS=true
              else
                echo "All publish attempts failed"
              fi
            fi
          fi

          # 如果发布失败，回滚版本号
          if [ "$PUBLISH_SUCCESS" = false ]; then
            echo "Publishing failed, rolling back version number..."
            git reset --hard HEAD~1
            git tag -d "v$NEW_VERSION" || echo "Tag deletion failed"
            echo "Version rollback completed. Package.json is back to previous version."
            exit 1
          fi

      - name: Get version for release
        id: get-version
        run: echo "version=$(node -p "require('./package.json').version")" >> $GITHUB_OUTPUT

      - name: Create GitHub Release
        uses: actions/create-release@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: v${{ steps.get-version.outputs.version }}
          release_name: Release v${{ steps.get-version.outputs.version }}
          body: |
            Auto-deployed from commit: ${{ github.event.head_commit.message }}

            Changes:
            ${{ github.event.head_commit.message }}
          draft: false
          prerelease: false
