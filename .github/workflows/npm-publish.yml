name: Auto Deploy to NPM

on:
  push:
    branches: [main]

permissions:
  contents: write
  actions: write

jobs:
  deploy:
    if: contains(github.event.head_commit.message, 'publish')
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0
          persist-credentials: true

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          registry-url: 'https://registry.npmjs.org'

      - name: Install dependencies
        run: npm ci

      - name: Build package
        run: npm run build

      - name: Configure Git
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"

      - name: Verify npm authentication
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          echo "=== npm authentication check ==="
          npm whoami
          echo "✅ npm authentication successful"

      - name: Bump version and publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          PACKAGE_NAME=$(node -p "require('./package.json').name")
          REMOTE_VERSION=$(npm view $PACKAGE_NAME version 2>/dev/null || echo "0.0.0")
          LOCAL_VERSION=$(node -p "require('./package.json').version")
          echo "Remote: $REMOTE_VERSION | Local: $LOCAL_VERSION"

          # 根据 commit message 决定版本类型（默认 patch）
          DEPLOY_TYPE="patch"
          COMMIT_MSG="${{ github.event.head_commit.message }}"
          if [[ $COMMIT_MSG =~ ^breaking: ]] || [[ $COMMIT_MSG =~ \[publish:major\] ]]; then
            DEPLOY_TYPE="major"
          elif [[ $COMMIT_MSG =~ ^feat: ]] || [[ $COMMIT_MSG =~ \[publish:minor\] ]]; then
            DEPLOY_TYPE="minor"
          fi
          echo "Deploy type: $DEPLOY_TYPE"

          # 更新版本号（仅本地，不 commit）
          npm version $DEPLOY_TYPE --no-git-tag-version
          NEW_VERSION=$(node -p "require('./package.json').version")
          echo "New version: $NEW_VERSION"

          # ⚡ 先发布到 npm — 失败时版本号不会污染 git
          echo "Publishing $PACKAGE_NAME@$NEW_VERSION ..."
          if ! npm publish; then
            echo "❌ Publish failed! Version NOT committed to git — safe to retry."
            exit 1
          fi
          echo "✅ Published $PACKAGE_NAME@$NEW_VERSION"

          # 发布成功后才提交版本号并打 tag
          git remote set-url origin https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git
          git add package.json package-lock.json
          git commit -m "chore: bump version to v$NEW_VERSION [skip ci]"
          git tag "v$NEW_VERSION"
          git push origin main
          git push origin "v$NEW_VERSION"

      - name: Get version for release
        id: get-version
        run: echo "version=$(node -p "require('./package.json').version")" >> $GITHUB_OUTPUT

      - name: Create GitHub Release
        uses: actions/create-release@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: v${{ steps.get-version.outputs.version }}
          release_name: Release v${{ steps.get-version.outputs.version }}
          body: |
            Auto-deployed from commit: ${{ github.event.head_commit.message }}
          draft: false
          prerelease: false
